<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient for tunnel portal ring -->
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Dark slate gradient for mascot body -->
    <linearGradient id="pgSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Ulule Cyan 3D Eye Gradient -->
    <radialGradient id="cyanEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <!-- Ulule Red 3D Eye Gradient -->
    <radialGradient id="redEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
  </defs>

  <!-- Cyber SSH Tunnel Outer Rings -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#portalGrad)" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.7"/>
  <circle cx="50" cy="50" r="43" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.35"/>

  <!-- Elephant Left Ear flap -->
  <path d="M 26 38 C 16 42 16 60 27 64 C 29 65 31 63 31 60 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" opacity="0.8"/>
  <!-- Elephant Right Ear flap -->
  <path d="M 74 38 C 84 42 84 60 73 64 C 71 65 69 63 69 60 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" opacity="0.8"/>

  <!-- Ulule Owl Main Head Silhouette -->
  <!-- Starts near left horn, top bridge, right horn, round cheeks, chin -->
  <path d="M 31 28 
           C 28 20 37 21 41 27 
           C 44 26 56 26 59 27 
           C 63 21 72 20 69 28 
           C 78 37 77 64 68 73 
           C 60 81 40 81 32 73 
           C 23 64 22 37 31 28 Z" 
        fill="url(#pgSlate)" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Postgres Elephant Trunk (acting as data conduit / tunnel pipe) -->
  <path d="M 46 60 
           C 46 73 43 79 50 82 
           C 56 84 59 78 56 73 
           C 53 69 53 65 54 60 Z" 
        fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <!-- Ivory Tusk -->
  <path d="M 54 70 C 61 72 61 67 59 65 C 58 68 56 69 54 70 Z" fill="#f8fafc"/>

  <!-- Owl Large Eye Sockets (White) -->
  <circle cx="39" cy="46" r="12.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="61" cy="46" r="12.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- Center Beak / Divider -->
  <ellipse cx="50" cy="46" rx="1.6" ry="3.8" fill="#0f172a"/>

  <!-- Left Eye: Cyan / Blue Anaglyph 3D -->
  <circle cx="40" cy="46" r="7.8" fill="url(#cyanEye)"/>
  <circle cx="41" cy="46.5" r="4.2" fill="#0c4a6e"/>
  <circle cx="38" cy="43" r="2.2" fill="#ffffff"/>

  <!-- Right Eye: Red / Crimson Anaglyph 3D -->
  <circle cx="60" cy="46" r="7.8" fill="url(#redEye)"/>
  <circle cx="59" cy="46.5" r="4.2" fill="#4c0519"/>
  <circle cx="58" cy="43" r="2.2" fill="#ffffff"/>

  <!-- Data stream / tunnel glow tick at bottom of trunk -->
  <circle cx="51" cy="80" r="1.2" fill="#38bdf8"/>
</svg>
