version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # Defaults disabled by golangci-lint.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Tool error messages are full sentences shown to the LLM, kept
        # identical to postgres-mcp's.
        - -ST1005
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
