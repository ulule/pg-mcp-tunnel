# Exemple de configuration pour pg-mcp-tunnel.
# À copier dans ~/.config/pg-mcp-tunnel/config.yaml puis à adapter.

targets:
  # Connexion locale directe (sans SSH).
  local:
    postgres:
      uri: postgresql://user:password@localhost:5432/mydb?sslmode=disable
    access_mode: unrestricted

  # Copie locale de la prod : lecture seule.
  copy_prod:
    postgres:
      uri: postgresql://user:password@localhost:5432/mydb2?sslmode=disable
    access_mode: restricted
    # Fonctions en lecture seule à autoriser en plus en mode restricted.
    # allowed_functions: [unaccent, generate_series]

  # Base distante via tunnel SSH.
  prod:
    ssh:
      host: remotehost.prod.com
      user: username
    postgres:
      remote_host: localhost
      remote_port: 5432
      database: myremotedb
      user: myuser
      sslmode: disable
    access_mode: restricted

  sandbox:
    ssh:
      host: remotehost.sandbox.com
      user: username
    postgres:
      remote_host: localhost
      remote_port: 5432
      database: myremotedb2
      user: myuser
      sslmode: disable
    access_mode: unrestricted
